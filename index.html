<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invidious Converter</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #cc181e; margin-top: 0; margin-bottom: 20px; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #cc181e;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }
        button:hover { background-color: #b01318; }
        .result-box {
            margin-top: 10px;
            padding: 20px;
            background: #eef9ff;
            border: 2px dashed #007bff;
            border-radius: 8px;
            display: none;
            word-break: break-all;
        }
        .btn-link {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-link:hover { background-color: #0056b3; }
        .info-text { font-size: 14px; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Invidious Converter</h2>
    <p class="info-text">Paste a YouTube link or share it directly from the YouTube app.</p>
    
    <input type="text" id="ytLink" placeholder="Paste YouTube link here...">
    
    <label for="server">Choose Server:</label>
    <select id="server" onchange="processConversion()">
        <option value="invidious.nerdvpn.de" selected>invidious.nerdvpn.de</option>
        <option value="invidious.privacydev.net">invidious.privacydev.net</option>
        <option value="yewtu.be">yewtu.be</option>
        <option value="inv.tux.pizza">inv.tux.pizza</option>
    </select>
    
    <button onclick="processConversion()">Convert Link</button>
    
    <div id="resultBox" class="result-box">
        <p style="margin: 0 0 10px 0; font-weight: bold;">Your anonymous video is ready:</p>
        <a id="invidiousLink" class="btn-link" href="#" target="_blank">Open Ad-Free Video 🚀</a>
    </div>
</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

function extractVideoId(text) {
    const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([^&?\s]+)/;
    const match = text.match(regex);
    return match ? match : null;
}

function processConversion() {
    const inputText = document.getElementById('ytLink').value.trim();
    const server = document.getElementById('server').value;
    const resultBox = document.getElementById('resultBox');
    const resultLink = document.getElementById('invidiousLink');
    
    if (inputText) {
        const id = extractVideoId(inputText);
        if (id) {
            const newUrl = `https://${server}/watch?v=${id}`;
            resultLink.href = newUrl;
            resultBox.style.display = 'block';
        } else {
            alert('⚠️ Please enter a valid YouTube link.');
            resultBox.style.display = 'none';
        }
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    // Intercetta tutte le possibili variabili inviate dal menu condividi di Android
    const sharedText = params.get('url') || params.get('text') || params.get('title');
    
    if (sharedText) {
        const urlRegex = /(https?:\/\/[^\s]+)/;
        const matchUrl = sharedText.match(urlRegex);
        const urlToProcess = matchUrl ? matchUrl[0] : sharedText;

        const id = extractVideoId(urlToProcess);
        if (id) {
            document.getElementById('ytLink').value = urlToProcess;
            setTimeout(processConversion, 150);
        }
    }
});
</script>

</body>
</html>
